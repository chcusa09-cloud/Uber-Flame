<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uber Flame Admin</title><style>
body{margin:0;background:#050914;color:#f8fbff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:560px;margin:40px auto;padding:16px}.box{background:#11182d;border:1px solid #27334d;border-radius:18px;padding:20px;margin-bottom:14px}h1{margin-top:0}label{display:block;color:#9fb1c7;font-size:.8rem;margin:10px 0 5px}input{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #34415d;background:#07101f;color:white}button,a{display:inline-block;margin-top:12px;padding:10px 13px;border:0;border-radius:10px;background:#31f3c0;color:#061417;font-weight:800;text-decoration:none}.muted{color:#9fb1c7;font-size:.85rem}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #26324b}.ok{color:#31f3c0}.bad{color:#ff8c9d}</style></head>
<body><div class="wrap"><div class="box"><h1>🔐 Admin Configuration</h1><div class="muted">API values remain server-side and are never displayed here.</div><div id="login"><label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password"><button id="go">Sign in</button><div id="msg" class="muted"></div></div><div id="panel" style="display:none"><div id="vars"></div><button id="out">Sign out</button> <a href="/">Dashboard</a></div></div></div>
<script>
const names={RAPIDAPI_KEY:"RapidAPI Events",AERODATABOX_KEY:"AeroDataBox",BESTTIME_PUBLIC_KEY:"BestTime Public",BESTTIME_PRIVATE_KEY:"BestTime Private",PREDICTHQ_TOKEN:"PredictHQ",TICKETMASTER_KEY:"Ticketmaster",ADMIN_USER:"Admin Username",ADMIN_PASSWORD:"Admin Password",AUTH_SECRET:"Session Secret"};
async function status(){const r=await fetch("/api/admin-status");if(r.status===401)return false;const j=await r.json();document.getElementById("login").style.display="none";document.getElementById("panel").style.display="block";document.getElementById("vars").innerHTML=Object.entries(j.configured).map(([k,v])=>`<div class="row"><span>${names[k]||k}</span><b class="${v?"ok":"bad"}">${v?"Configured":"Missing"}</b></div>`).join("");return true}
document.getElementById("go").onclick=async()=>{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})});const j=await r.json();msg.textContent=j.ok?"Signed in.":(j.error||"Login failed");if(j.ok)status()};
document.getElementById("out").onclick=async()=>{await fetch("/api/logout",{method:"POST"});location.reload()};status();
</script></body></html>
